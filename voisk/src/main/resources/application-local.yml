spring:
  datasource:
    mysql:
      url: ${MYSQL_URL}
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    postgres:
      url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/voisk_vector?sslmode=disable}
      username: ${POSTGRES_USERNAME:admin}
      password: ${POSTGRES_PASSWORD:1234}
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 로컬 데이터 보존이 기본입니다. 스키마를 초기화해야 할 때만
      # MYSQL_DDL_AUTO=create를 명시해서 실행합니다.
      ddl-auto: ${MYSQL_DDL_AUTO:update}

embed:
  server:
    url: http://localhost:8000

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash
